name: Generate contribution orbit

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: contribution-orbit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: ThisulHerath
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%230d7764&color_dots=%23edf3ef,%23c3e8d1,%238bd2af,%235eb596,%232a8b73
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23d6f77b&color_dots=%230e1a27,%23203e3d,%232c6c5c,%2347a88a,%236ce5c0
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
