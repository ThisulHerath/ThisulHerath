name: Refresh orbital telemetry

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/profile-telemetry.yml

permissions:
  contents: write

concurrency:
  group: profile-telemetry
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read public GitHub activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_telemetry.py
      - name: Save refreshed telemetry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/orbital/05-telemetry.svg
          if ! git diff --staged --quiet; then
            git commit -m "Refresh orbital profile telemetry"
            git pull --rebase origin main
            git push
          fi
