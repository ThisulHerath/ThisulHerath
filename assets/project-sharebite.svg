<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" role="img" aria-labelledby="title">
<title id="title">Floating food bowl and leaf</title>
<style>
.float{animation:float 6s ease-in-out infinite}.late{animation-delay:-3s}.pulse{animation:pulse 4s ease-in-out infinite}.flow{stroke-dasharray:6 10;animation:flow 12s linear infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-160}}
@media(prefers-reduced-motion:reduce){.float,.pulse,.flow{animation:none}}
</style>
<defs>
  <pattern id="backdrop-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1" fill="#849da8" opacity=".28"/></pattern>
  <radialGradient id="backdrop-glow"><stop stop-color="#80c9bc" stop-opacity=".13"/><stop offset="1" stop-color="#80c9bc" stop-opacity="0"/></radialGradient>
</defs>
<rect x="5" y="5" width="230" height="190" rx="24" fill="url(#backdrop-glow)"/>
<rect x="5" y="5" width="230" height="190" rx="24" fill="url(#backdrop-dots)"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<g class="float"><path d="M48 104 H192 Q182 160 120 160 Q58 160 48 104Z" fill="#101f2c" stroke="#526875" stroke-width="2"/>
<path d="M43 104 H197 M92 169 H148" stroke="#f18b55" stroke-width="4"/>
<path d="M121 98 C93 82 104 45 153 40 C160 70 147 93 121 98Z" fill="#172e3b" stroke="#80c9bc" stroke-width="2"/>
<path d="M119 104 Q126 77 145 54" stroke="#80c9bc" stroke-width="2"/></g>
<path d="M77 83 Q67 71 77 59 M172 86 Q163 73 173 62" stroke="#849da8" stroke-width="2" class="float late"/>
<circle cx="207" cy="128" r="4" fill="#f18b55" class="pulse"/></g>
</svg>