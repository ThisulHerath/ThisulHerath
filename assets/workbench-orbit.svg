<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" role="img" aria-labelledby="title">
<title id="title">Floating tools orbiting a central code symbol</title>
<style>
.float{animation:float 6s ease-in-out infinite}.late{animation-delay:-3s}.pulse{animation:pulse 4s ease-in-out infinite}.flow{stroke-dasharray:6 10;animation:flow 12s linear infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-160}}
@media(prefers-reduced-motion:reduce){.float,.pulse,.flow{animation:none}}
</style>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<ellipse cx="120" cy="103" rx="99" ry="57" stroke="#526875" class="flow"/>
<ellipse cx="120" cy="103" rx="58" ry="86" stroke="#526875" transform="rotate(35 120 103)"/>
<circle cx="120" cy="103" r="35" fill="#101f2c" stroke="#f18b55"/>
<path d="M108 91 L96 103 L108 115 M132 91 L144 103 L132 115" stroke="#f18b55" stroke-width="3"/>
<g class="float"><rect x="20" y="58" width="43" height="37" rx="9" fill="#172e3b" stroke="#80c9bc"/>
<path d="M30 69 H52 M30 76 H45 M30 83 H49" stroke="#80c9bc" stroke-width="2"/></g>
<g class="float late"><rect x="173" y="110" width="40" height="53" rx="9" fill="#101f2c" stroke="#f18b55"/>
<path d="M184 121 H202 M189 153 H197" stroke="#f18b55" stroke-width="2"/></g>
<circle cx="152" cy="31" r="6" fill="#80c9bc" class="pulse"/><circle cx="77" cy="167" r="5" fill="#f18b55" class="pulse"/></g>
</svg>