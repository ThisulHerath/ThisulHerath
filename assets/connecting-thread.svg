<svg xmlns="http://www.w3.org/2000/svg" width="800" height="112" viewBox="0 0 800 112" role="img" aria-labelledby="title">
<title id="title">An animated thread connecting data, ideas, and useful applications</title>
<style>
.float{animation:float 6s ease-in-out infinite}.late{animation-delay:-3s}.pulse{animation:pulse 4s ease-in-out infinite}.flow{stroke-dasharray:6 10;animation:flow 12s linear infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-160}}
@media(prefers-reduced-motion:reduce){.float,.pulse,.flow{animation:none}}
</style>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M36 58 H764" stroke="#526875"/>
<path d="M36 58 H764" stroke="#f18b55" stroke-width="2" class="flow"/>
