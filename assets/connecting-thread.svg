<g class="float late"><rect x="371" y="29" width="58" height="58" rx="15" fill="#101f2c" stroke="#f18b55"/><path d="M388 49 L400 41 L412 49 V64 L400 72 L388 64Z M388 49 L412 64 M412 49 L388 64" stroke="#f18b55" stroke-width="2"/></g>
<g class="float"><rect x="637" y="29" width="58" height="58" rx="15" fill="#101f2c" stroke="#80c9bc"/><path d="M651 48 H681 V68 H651Z M658 75 H674" stroke="#80c9bc" stroke-width="2"/></g></g>
