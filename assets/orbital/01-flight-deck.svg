,Helvetica,sans-serif" font-size="17" font-weight="400" letter-spacing="0">AI/ML ideas &amp; useful software</text><rect x="848" y="192" width="314" height="148" rx="12" fill="#132320" stroke="#335147"/><text x="868" y="221" fill="#d6f77b" font-family="'Courier New',monospace" font-size="11" font-weight="400" letter-spacing="1">RESEARCH QUESTION</text><text x="868" y="254" fill="#edf5f2" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" letter-spacing="0">What happens after</text><text x="868" y="283" fill="#edf5f2" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" letter-spacing="0">the experiment?</text><text x="868" y="312" fill="#edf5f2" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="0">Make it useful. Ship it.</text><path d="M36 379H1164" stroke="#26394a" /><text x="36" y="411" fill="#9cb1bf" font-family="'Courier New',monospace" font-size="12" font-weight="400" letter-spacing="1">FIRST JAVA. THEN PYTHON. NOW FOLLOWING THE NEXT GOOD QUESTION.</text></svg>
