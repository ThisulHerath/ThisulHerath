<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="438" viewBox="0 0 1200 438" role="img" aria-labelledby="title desc"><title id="title">Flight deck — About Thisul</title><desc id="desc">IT undergraduate in Sri Lanka. Exploring advanced NLP, AI/ML and React Native. Open to collaboration.</desc><defs>
