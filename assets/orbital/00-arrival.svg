<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">Thisul Herath — Orbital Research Station</title><desc id="desc">An animated orbital emblem in mint and chartreuse. AI/ML, full-stack and mobile development. Based in Sri Lanka, UTC+05:30.</desc><defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#203347" stroke-opacity=".32"/></pattern>
      <radialGradient id="halo"><stop stop-color="#6ce5c0" stop-opacity=".16"/><stop offset="1" stop-color="#6ce5c0" stop-opacity="0"/></radialGradient>
      <linearGradient id="beam"><stop stop-color="#6ce5c0"/><stop offset="1" stop-color="#d6f77b"/></linearGradient>
    </defs>
    <style>
      .orbit{transform-origin:940px 242px;animation:orbit 48s linear infinite}
      .pulse{animation:pulse 4s ease-in-out infinite}
      .drift{animation:drift 6s ease-in-out infinite}
      @keyframes orbit{to{transform:rotate(360deg)}}
      @keyframes pulse{50%{opacity:.4}}
      @keyframes drift{50%{transform:translateY(-7px)}}
      @media(prefers-reduced-motion:reduce){.orbit,.pulse,.drift{animation:none}}
    </style><rect x="1" y="1" width="1198" height="478" rx="18" fill="#080f19" stroke="#26394a"/><rect x="700" y="2" width="498" height="476" rx="18" fill="url(#grid)"/><circle cx="940" cy="242" r="245" fill="url(#halo)"/><rect x="32" y="30" width="38" height="38" rx="8" fill="#d6f77b" stroke="#d6f77b"/><text x="39" y="55" fill="#080f19" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="0">th</text><text x="86" y="54" fill="#6ce5c0" font-family="'Courier New',monospace" font-size="13" font-weight="400" letter-spacing="2">ORBITAL / RESEARCH STATION</text><text x="34" y="115" fill="#9cb1bf" font-family="'Courier New',monospace" font-size="12" font-weight="400" letter-spacing="2">EXPLORER FILE  /  THISULHERATH</text><text x="30" y="190" fill="#edf5f2" font-family="Arial,Helvetica,sans-serif" font-size="76" font-weight="700" letter-spacing="-3">THISUL</text><text x="30" y="267" fill="#edf5f2" font-family="Arial,Helvetica,sans-serif" font-size="76" font-weight="700" letter-spacing="-3">HERATH</text><text x="35" y="311" fill="#d6f77b" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" letter-spacing="0">Curiosity is the launch sequence.</text><text x="35" y="347" fill="#9cb1bf" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Data. Intelligence. Interfaces.</text><path d="M35 381H656" stroke="#26394a" /><text x="35" y="414" fill="#edf5f2" font-family="'Courier New',monospace" font-size="13" font-weight="400" letter-spacing="2">AI / ML</text><text x="180" y="414" fill="#edf5f2" font-family="'Courier New',monospace" font-size="13" font-weight="400" letter-spacing="2">FULL STACK</text><text x="370" y="414" fill="#edf5f2" font-family="'Courier New',monospace" font-size="13" font-weight="400" letter-spacing="2">MOBILE</text><circle class="pulse" cx="40" cy="450" r="4" fill="#6ce5c0"/><text x="54" y="454" fill="#9cb1bf" font-family="'Courier New',monospace" font-size="11" font-weight="400" letter-spacing="1">SRI LANKA  /  UTC+05:30  /  ALWAYS EXPLORING</text><g fill="none" stroke="#395a67"><circle cx="940" cy="242" r="177" stroke-dasharray="3 9"/><ellipse cx="940" cy="242" rx="204" ry="79" transform="rotate(-35 940 242)"/><ellipse cx="940" cy="242" rx="204" ry="79" transform="rotate(35 940 242)"/><circle cx="940" cy="242" r="110"/></g><g class="orbit"><circle cx="940" cy="65" r="7" fill="#d6f77b"/><circle cx="940" cy="419" r="4" fill="#6ce5c0"/><path d="M940 51V38M926 65H913M954 65H967" stroke="#d6f77b"/></g><g class="drift"><rect x="876" y="178" width="128" height="128" rx="26" fill="#0e1a27" stroke="#6ce5c0"/><text x="897" y="257" fill="#d6f77b" font-family="'Courier New',monospace" font-size="32" font-weight="700" letter-spacing="0">{ th }</text></g><text x="777" y="43" fill="#9cb1bf" font-family="'Courier New',monospace" font-size="10" font-weight="400" letter-spacing="2">DEEP SPACE / OPEN SOURCE</text><text x="827" y="454" fill="#6ce5c0" font-family="'Courier New',monospace" font-size="11" font-weight="400" letter-spacing="0">IDEA → EXPERIMENT → BUILD</text></svg>
