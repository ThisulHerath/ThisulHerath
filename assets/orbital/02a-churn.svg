<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="256" viewBox="0 0 1200 256" role="img" aria-labelledby="title desc"><title id="title">TELCO CUSTOMER CHURN</title><desc id="desc">From customer data to a prediction service. Data preparation · Feature engineering · Experiment tracking. Python / MLflow / FastAPI / Docker / GitHub Actions. Open the linked project repository for source and documentation.</desc><defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#203347" stroke-opacity=".32"/></pattern>
