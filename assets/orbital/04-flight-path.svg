<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">Flight path — From Java to intelligent applications</title><desc id="desc">Java foundations, Python and ML experiments, web and mobile builds, and an ongoing exploration of NLP.</desc><defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#203347" stroke-opacity=".32"/></pattern>
      <radialGradient id="halo"><stop stop-color="#6ce5c0" stop-opacity=".16"/><stop offset="1" stop-color="#6ce5c0" stop-opacity="0"/></radialGradient>
      <linearGradient id="beam"><stop stop-color="#6ce5c0"/><stop offset="1" stop-color="#d6f77b"/></linearGradient>
    </defs>
    <style>
      .orbit{transform-origin:940px 242px;animation:orbit 48s linear infinite}
      .pulse{animation:pulse 4s ease-in-out infinite}
      .drift{animation:drift 6s ease-in-out infinite}
      @keyframes orbit{to{transform:rotate(360deg)}}
      @keyframes pulse{50%{opacity:.4}}
      @keyframes drift{50%{transform:translateY(-7px)}}
      @media(prefers-reduced-motion:reduce){.orbit,.pulse,.drift{animation:none}}
    </style><rect x="1" y="1" width="1198" height="328" rx="18" fill="#080f19" stroke="#26394a"/><text x="32" y="36" fill="#6ce5c0" font-family="Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" letter-spacing="2">04 / FLIGHT PATH</text><text x="888" y="36" fill="#9cb1bf" font-family="Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" letter-spacing="1">KEEP FOLLOWING CURIOSITY</text><path d="M32 54H1168" stroke="#26394a" /><path d="M100 128H1100" stroke="#395a67" stroke-width="2" stroke-dasharray="5 8"/><circle cx="100" cy="128" r="23" fill="#080f19" stroke="#6ce5c0" stroke-width="2"/><text x="89" y="133" fill="#6ce5c0" font-family="Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" letter-spacing="0">01</text><text x="70" y="192" fill="#edf5f2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="0">THE SPARK</text><text x="70" y="223" fill="#9cb1bf" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" letter-spacing="0">Java foundations.</text><text x="70" y="248" fill="#9cb1bf" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" letter-spacing="0">A first line of code.</text><circle cx="390" cy="128" r="23" fill="#080f19" stroke="#6ce5c0" stroke-width="2"/><text x="379" y="133" fill="#6ce5c0" font-family="Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" letter-spacing="0">02</text><text x="360" y="192" fill="#edf5f2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="0">THE EXPERIMENT</text><text x="360" y="223" fill="#9cb1bf" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" letter-spacing="0">Python, data &amp; ML.</text><text x="360" y="248" fill="#9cb1bf" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" letter-spacing="0">Questions become models.</text><circle cx="680" cy="128" r="23" fill="#080f19" stroke="#6ce5c0" stroke-width="2"/><text x="669" y="133" fill="#6ce5c0" font-family="Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" letter-spacing="0">03</text><text x="650" y="192" fill="#edf5f2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="0">THE BUILD</text><text x="650" y="223" fill="#9cb1bf" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" letter-spacing="0">Web &amp; mobile apps.</text><text x="650" y="248" fill="#9cb1bf" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" letter-spacing="0">Ideas become interfaces.</text><circle cx="970" cy="128" r="23" fill="#080f19" stroke="#d6f77b" stroke-width="2"/><text x="959" y="133" fill="#d6f77b" font-family="Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" letter-spacing="0">04</text><text x="940" y="192" fill="#edf5f2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="0">THE NEXT ORBIT</text><text x="940" y="223" fill="#9cb1bf" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" letter-spacing="0">NLP &amp; intelligent apps.</text><text x="940" y="248" fill="#9cb1bf" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" letter-spacing="0">Still exploring.</text><text x="32" y="302" fill="#6ce5c0" font-family="Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" letter-spacing="1">NO FINAL LEVEL. JUST BETTER QUESTIONS AND MORE USEFUL BUILDS.</text></svg>
