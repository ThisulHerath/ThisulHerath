<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-labelledby="title desc"><title id="title">Mission archive — Featured projects</title><desc id="desc">Customer churn prediction, shared student resources, and surplus food redistribution.</desc><defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#203347" stroke-opacity=".32"/></pattern>
      <radialGradient id="halo"><stop stop-color="#6ce5c0" stop-opacity=".16"/><stop offset="1" stop-color="#6ce5c0" stop-opacity="0"/></radialGradient>
      <linearGradient id="beam"><stop stop-color="#6ce5c0"/><stop offset="1" stop-color="#d6f77b"/></linearGradient>
    </defs>
    <style>
      .orbit{transform-origin:940px 242px;animation:orbit 48s linear infinite}
      .pulse{animation:pulse 4s ease-in-out infinite}
      .drift{animation:drift 6s ease-in-out infinite}
      @keyframes orbit{to{transform:rotate(360deg)}}
      @keyframes pulse{50%{opacity:.4}}
      @keyframes drift{50%{transform:translateY(-7px)}}
      @media(prefers-reduced-motion:reduce){.orbit,.pulse,.drift{animation:none}}
    </style><rect x="1" y="1" width="1198" height="128" rx="18" fill="#080f19" stroke="#26394a"/><text x="32" y="36" fill="#6ce5c0" font-family="'Courier New',monospace" font-size="13" font-weight="400" letter-spacing="2">02 / MISSION ARCHIVE</text><text x="888" y="36" fill="#9cb1bf" font-family="'Courier New',monospace" font-size="11" font-weight="400" letter-spacing="1">SELECTED PROJECTS</text><path d="M32 54H1168" stroke="#26394a" /><text x="32" y="100" fill="#edf5f2" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" letter-spacing="0">Three problems. One instinct: make information useful.</text></svg>
