<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-labelledby="title desc"><title id="title">Mission archive — Featured projects</title><desc id="desc">Customer churn prediction, shared student resources, and surplus food redistribution.</desc><defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#203347" stroke-opacity=".32"/></pattern>
      <radialGradient id="halo"><stop stop-color="#6ce5c0" stop-opacity=".16"/><stop offset="1" stop-color="#6ce5c0" stop-opacity="0"/></radialGradient>
      <linearGradient id="beam"><stop stop-color="#6ce5c0"/><stop offset="1" stop-color="#d6f77b"/></linearGradient>
    </defs>
    <style>
      .orbit{transform-origin:940px 242px;animation:orbit 48s linear infinite}
      .pulse{animation:pulse 4s ease-in-out infinite}
      .drift{animation:drift 6s ease-in-out infinite}
      .snow{animation:snowfall linear infinite}
      @keyframes snowfall{from{transform:translate(0,0)}to{transform:translate(0,var(--snow-distance))}}
      @keyframes orbit{to{transform:rotate(360deg)}}
      @keyframes pulse{50%{opacity:.4}}
      @keyframes drift{50%{transform:translateY(-7px)}}
      @media(prefers-reduced-motion:reduce){.orbit,.pulse,.drift{animation:none}.snow{display:none}}
    </style><defs><clipPath id="snow-clip"><rect x="2" y="2" width="1196" height="126" rx="17"/></clipPath></defs><rect x="1" y="1" width="1198" height="128" rx="18" fill="#080f19" stroke="#26394a"/><text x="32" y="36" fill="#6ce5c0" font-family="Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" letter-spacing="2">02 / MISSION ARCHIVE</text><text x="888" y="36" fill="#9cb1bf" font-family="Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" letter-spacing="1">SELECTED PROJECTS</text><path d="M32 54H1168" stroke="#26394a" /><text x="32" y="100" fill="#edf5f2" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" letter-spacing="0">Three problems. One instinct: make information useful.</text><g aria-hidden="true" pointer-events="none" clip-path="url(#snow-clip)" style="--snow-distance:130px"><g class="snow" style="animation-duration:22.8s;animation-delay:-1.1s"><circle cx="1175.6" cy="4.0" r="2.4" fill="#6ce5c0" opacity=".5"/><circle cx="1175.6" cy="-126.0" r="2.4" fill="#6ce5c0" opacity=".5"/></g><g class="snow" style="animation-duration:16.2s;animation-delay:-7.7s"><circle cx="1188.4" cy="50.9" r="2.1" fill="#edf5f2" opacity=".5"/><circle cx="1188.4" cy="-79.1" r="2.1" fill="#edf5f2" opacity=".5"/></g><g class="snow" style="animation-duration:22.2s;animation-delay:-11.2s"><circle cx="11.1" cy="58.6" r="2.2" fill="#edf5f2" opacity=".5"/><circle cx="11.1" cy="-71.4" r="2.2" fill="#edf5f2" opacity=".5"/></g><g class="snow" style="animation-duration:13.2s;animation-delay:-2.2s"><circle cx="14.6" cy="21.6" r="1.1" fill="#edf5f2" opacity=".5"/><circle cx="14.6" cy="-108.4" r="1.1" fill="#edf5f2" opacity=".5"/></g><g class="snow" style="animation-duration:16.2s;animation-delay:-0.1s"><circle cx="16.3" cy="63.1" r="1.7" fill="#edf5f2" opacity=".5"/><circle cx="16.3" cy="-66.9" r="1.7" fill="#edf5f2" opacity=".5"/></g><g class="snow" style="animation-duration:12.2s;animation-delay:-6.8s"><circle cx="1187.7" cy="118.0" r="1.7" fill="#edf5f2" opacity=".5"/><circle cx="1187.7" cy="-12.0" r="1.7" fill="#edf5f2" opacity=".5"/></g><g class="snow" style="animation-duration:17.4s;animation-delay:-15.8s"><circle cx="16.7" cy="73.4" r="2.4" fill="#6ce5c0" opacity=".5"/><circle cx="16.7" cy="-56.6" r="2.4" fill="#6ce5c0" opacity=".5"/></g><g class="snow" style="animation-duration:19.9s;animation-delay:-14.7s"><circle cx="17.5" cy="88.3" r="1.9" fill="#edf5f2" opacity=".5"/><circle cx="17.5" cy="-41.7" r="1.9" fill="#edf5f2" opacity=".5"/></g><g class="snow" style="animation-duration:13.6s;animation-delay:-10.9s"><circle cx="1185.0" cy="27.5" r="1.2" fill="#edf5f2" opacity=".5"/><circle cx="1185.0" cy="-102.5" r="1.2" fill="#edf5f2" opacity=".5"/></g><g class="snow" style="animation-duration:19.7s;animation-delay:-4.1s"><circle cx="12.8" cy="73.1" r="1.2" fill="#edf5f2" opacity=".5"/><circle cx="12.8" cy="-56.9" r="1.2" fill="#edf5f2" opacity=".5"/></g><g class="snow" style="animation-duration:14.1s;animation-delay:-0.2s"><circle cx="22.4" cy="58.1" r="1.3" fill="#edf5f2" opacity=".5"/><circle cx="22.4" cy="-71.9" r="1.3" fill="#edf5f2" opacity=".5"/></g><g class="snow" style="animation-duration:19.5s;animation-delay:-12.0s"><circle cx="13.7" cy="10.5" r="2.0" fill="#edf5f2" opacity=".5"/><circle cx="13.7" cy="-119.5" r="2.0" fill="#edf5f2" opacity=".5"/></g><g class="snow" style="animation-duration:18.6s;animation-delay:-2.8s"><circle cx="18.5" cy="120.7" r="1.0" fill="#6ce5c0" opacity=".5"/><circle cx="18.5" cy="-9.3" r="1.0" fill="#6ce5c0" opacity=".5"/></g><g class="snow" style="animation-duration:21.9s;animation-delay:-10.1s"><circle cx="11.5" cy="1.5" r="1.4" fill="#edf5f2" opacity=".5"/><circle cx="11.5" cy="-128.5" r="1.4" fill="#edf5f2" opacity=".5"/></g></g></svg>
