<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">SHAREBITE LK</title><desc id="desc">Good food deserves another destination. Surplus listings · Local discovery · Reservations · Team project. React / Vite / Express / MongoDB / JWT. Includes a conceptual interface illustration. Open the linked project repository for source and documentation.</desc><defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#203347" stroke-opacity=".32"/></pattern>
      <radialGradient id="halo"><stop stop-color="#6ce5c0" stop-opacity=".16"/><stop offset="1" stop-color="#6ce5c0" stop-opacity="0"/></radialGradient>
      <linearGradient id="beam"><stop stop-color="#6ce5c0"/><stop offset="1" stop-color="#d6f77b"/></linearGradient>
    </defs>
    <style>
      .orbit{transform-origin:940px 242px;animation:orbit 48s linear infinite}
      .pulse{animation:pulse 4s ease-in-out infinite}
      .drift{animation:drift 6s ease-in-out infinite}
      @keyframes orbit{to{transform:rotate(360deg)}}
      @keyframes pulse{50%{opacity:.4}}
      @keyframes drift{50%{transform:translateY(-7px)}}
      @media(prefers-reduced-motion:reduce){.orbit,.pulse,.drift{animation:none}}
    </style><rect x="1" y="1" width="1198" height="298" rx="18" fill="#080f19" stroke="#26394a"/><text x="32" y="36" fill="#6ce5c0" font-family="Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" letter-spacing="2">MISSION 03 / FIELD WORK</text><text x="884" y="36" fill="#d6f77b" font-family="Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" letter-spacing="0">EXPLORE REPOSITORY ↗</text><path d="M32 54H1168" stroke="#26394a" /><text x="32" y="105" fill="#edf5f2" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5">SHAREBITE LK</text><text x="34" y="143" fill="#d6f77b" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" letter-spacing="0">Good food deserves another destination.</text><text x="34" y="181" fill="#9cb1bf" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Surplus listings · Local discovery · Reservations · Team project</text><text x="34" y="218" fill="#edf5f2" font-family="Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" letter-spacing="0">React / Vite / Express / MongoDB / JWT</text><rect x="34" y="242" width="340" height="32" rx="6" fill="#152b26" stroke="#335147"/><text x="48" y="263" fill="#6ce5c0" font-family="Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" letter-spacing="1">SURPLUS → OPPORTUNITY</text><rect x="820" y="76" width="344" height="198" rx="12" fill="#0b1520" stroke="#26394a"/><text x="838" y="99" fill="#9cb1bf" font-family="Consolas,'Liberation Mono',monospace" font-size="10" font-weight="400" letter-spacing="1">INTERFACE STUDY</text><circle cx="1118" cy="95" r="3" fill="#6ce5c0"/><circle cx="1130" cy="95" r="3" fill="#26394a"/><circle cx="1142" cy="95" r="3" fill="#26394a"/><path d="M820 111H1164" stroke="#26394a" /><text x="838" y="139" fill="#edf5f2" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="0">Find food. Share good.</text><rect x="838" y="155" width="148" height="99" rx="8" fill="#0e1a27" stroke="#26394a"/><circle cx="861" cy="178" r="9" fill="#233e32" stroke="#6ce5c0"/><text x="852" y="213" fill="#d6f77b" font-family="Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" letter-spacing="0">DISCOVER</text><text x="852" y="236" fill="#9cb1bf" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" letter-spacing="0">Nearby food</text><rect x="996" y="155" width="148" height="99" rx="8" fill="#0e1a27" stroke="#26394a"/><circle cx="1019" cy="178" r="9" fill="#233e32" stroke="#6ce5c0"/><text x="1010" y="213" fill="#d6f77b" font-family="Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" letter-spacing="0">CONNECT</text><text x="1010" y="236" fill="#9cb1bf" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" letter-spacing="0">Community</text></svg>
