<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="256" viewBox="0 0 1200 256" role="img" aria-labelledby="title desc"><title id="title">SHAREBITE LK</title><desc id="desc">Good food deserves another destination. Surplus listings · Local discovery · Reservations · Team project. React / Vite / Express / MongoDB / JWT. Open the linked project repository for source and documentation.</desc><defs>
