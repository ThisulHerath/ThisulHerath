l="#edf5f2" opacity=".5"/><circle cx="1180.4" cy="-240.8" r="2.2" fill="#edf5f2" opacity=".5"/></g><g class="snow" style="animation-duration:16.9s;animation-delay:-9.8s"><circle cx="1186.6" cy="134.4" r="1.6" fill="#edf5f2" opacity=".5"/><circle cx="1186.6" cy="-164.6" r="1.6" fill="#edf5f2" opacity=".5"/></g><g class="snow" style="animation-duration:15.4s;animation-delay:-8.8s"><circle cx="1175.8" cy="128.6" r="1.1" fill="#6ce5c0" opacity=".5"/><circle cx="1175.8" cy="-170.4" r="1.1" fill="#6ce5c0" opacity=".5"/></g><g class="snow" style="animation-duration:19.6s;animation-delay:-14.6s"><circle cx="17.3" cy="297.6" r="1.4" fill="#edf5f2" opacity=".5"/><circle cx="17.3" cy="-1.4" r="1.4" fill="#edf5f2" opacity=".5"/></g></g></svg>
