<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="299" viewBox="0 0 1200 299" role="img" aria-labelledby="title desc"><title id="title">Open a channel — Let&#x27;s connect</title><desc id="desc">Have an AI/ML idea, an interesting dataset or a software project? Reach out to Thisul Herath.</desc><defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#203347" stroke-opacity=".32"/></pattern>
      <radialGradient id="halo"><stop stop-color="#6ce5c0" stop-opacity=".16"/><stop offset="1" stop-color="#6ce5c0" stop-opacity="0"/></radialGradient>
      <linearGradient id="beam"><stop stop-color="#6ce5c0"/><stop offset="1" stop-color="#d6f77b"/></linearGradient>
    </defs>
    <style>
      .orbit{transform-origin:940px 242px;animation:orbit 48s linear infinite}
      .pulse{animation:pulse 4s ease-in-out infinite}
      .drift{animation:drift 6s ease-in-out infinite}
      @keyframes orbit{to{transform:rotate(360deg)}}
      @keyframes pulse{50%{opacity:.4}}
      @keyframes drift{50%{transform:translateY(-7px)}}
      @media(prefers-reduced-motion:reduce){.orbit,.pulse,.drift{animation:none}}
    </style><rect x="1" y="1" width="1198" height="297" rx="18" fill="#080f19" stroke="#26394a"/><text x="32" y="36" fill="#6ce5c0" font-family="Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" letter-spacing="2">06 / OPEN A CHANNEL</text><text x="888" y="36" fill="#9cb1bf" font-family="Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" letter-spacing="1">COLLABORATION WELCOME</text><path d="M32 54H1168" stroke="#26394a" /><text x="32" y="112" fill="#edf5f2" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700" letter-spacing="0">Have a curious problem?</text><text x="32" y="155" fill="#d6f77b" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" letter-spacing="0">Let&#x27;s build something useful.</text><text x="34" y="201" fill="#9cb1bf" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" letter-spacing="0">AI/ML collaborations · Data questions · Web &amp; mobile ideas</text><path d="M32 234H1168" stroke="#26394a" /><text x="32" y="271" fill="#6ce5c0" font-family="Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" letter-spacing="2">THISUL HERATH / SRI LANKA</text><text x="885" y="271" fill="#9cb1bf" font-family="Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" letter-spacing="0">END OF TRANSMISSION _</text><g fill="none" stroke="#395a67"><circle cx="1040" cy="144" r="52"/><ellipse cx="1040" cy="144" rx="89" ry="25" transform="rotate(-25 1040 144)"/></g><circle class="pulse" cx="1104" cy="115" r="6" fill="#d6f77b"/></svg>
